})();

  /* Secret: Sunrise. Every window vanishes at once, a prompt asks about a sunrise, and OK plays a dithered one. */
  @keyframes sunriseOut { to { opacity: 0; transform: scale(0.8); } }

  .sunrise-gone { animation: sunriseOut 0.32s ease-in var(--sd, 0s) forwards !important; pointer-events: none !important; }
  .sunrise-back { animation: sunriseIn 0.45s ease-out var(--sd, 0s) backwards !important; }
  .sunrise-dialog { position: fixed; left: 50%; top: 36%; width: 300px; margin-left: -150px; z-index: 4000; cursor: default; animation: sunriseDlg 0.35s ease-out; }
  @keyframes sunriseDlg { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
  .sunrise-dialog .note-body { padding: 22px 16px 14px; font-size: 15px; }

  #sunriseWrap { position: fixed; left: 0; top: 0; width: 100%; height: calc(100% - 30px); z-index: 3900; overflow: hidden; opacity: 0; transition: opacity 0.9s ease; }
  #sunriseWrap canvas { display: block; width: 100%; height: 100%; }

  #sunriseLyric { position: absolute; left: 0; right: 0; text-align: center; pointer-events: none; padding: 0 5%; color: #800000; font: 14px 'MGPixel', 'MS Sans Serif', sans-serif; text-shadow: 0 0 3px rgba(247,238,240,0.95), 0 0 12px rgba(247,238,240,0.7); }
  #sunriseLyric p { position: absolute; left: 50%; top: 0; width: 66%; margin: 0 0 0 -33%; opacity: 0; letter-spacing: 0.14em; font-size: clamp(13px, 1.7vw, 26px); line-height: 1.5; }
  #sunriseLyric p.big { font-size: clamp(24px, 3.6vw, 60px); letter-spacing: 0.34em; }
  #sunriseGrain { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: 0.95; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); -webkit-mask-image: radial-gradient(circle at var(--gx, 50%) var(--gy, 40%), #000 var(--g1, 0px), rgba(0,0,0,0) var(--g2, 0px)); mask-image: radial-gradient(circle at var(--gx, 50%) var(--gy, 40%), #000 var(--g1, 0px), rgba(0,0,0,0) var(--g2, 0px)); }  .note.pop { animation: notePop 1s ease-out forwards; }
  .note.out { animation: noteOut 0.8s ease-in forwards; }
  .win.out { animation: noteOut 0.8s ease-in forwards; }
  @keyframes notePop {

  .startmenu { position: fixed; left: 0; bottom: 30px; z-index: 1100; width: 220px; background: #ede1e3; box-shadow: 0 0 0 1px #2a0808, 0 0 0 4px #ede1e3, 0 0 0 6px #2a0808; padding: 0 0 4px; font: 12px 'MGPixel', 'MS Sans Serif', sans-serif; }

  .tools, .swatches { position: fixed; z-index: 1001; padding: 4px 6px; }

  .tools { left: 14px; bottom: 36px; display: grid; grid-template-columns: repeat(2, 36px); gap: 2px; padding: 4px; }
  .tools button { width: 36px !important; height: 36px !important; background: #1c1c1c; color: #d0d0d0; border: 0; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; }
  .swatches { left: 80%; bottom: 46px; transform: translateX(-50%); display: flex; gap: 18px; align-items: center; }
  .swatch-grid { display: grid; grid-template-columns: repeat(8, 28px); gap: 6px; }
  .tools button, .swatches button {
    font: 15px 'MGPixel', 'MS Sans Serif', sans-serif; background: #ede1e3; color: #2a0808; cursor: pointer; padding: 0;
    width: 56px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0;
  }

  .tools button svg * { stroke-width: 1.9; vector-effect: none; }

<script>
(() => {
  const desk = document.getElementById("desk");
  const tasks = document.getElementById("tasks");
  let z = 10, nextId = 1, topZ = 1000, mayaTop = 900; // topZ: clicked windows and notes jump above everything on the desk

  // Original illustrations, generated from simple shapes so every window gets different art.
  const palettes = [
    ["#008080", "#d9a72b", "#f1e7d0", "#c8452f"],
    ["#5a2d4f", "#d9a72b", "#f1e7d0", "#2f7f7a"],
    ["#c8452f", "#f1e7d0", "#d9a72b", "#2a2330"],
    ["#2f7f7a", "#f1e7d0", "#c8452f", "#d9a72b"],
    ["#3b2f44", "#d9a72b", "#f1e7d0", "#2f7f7a"],
    ["#d9a72b", "#5a2d4f", "#f1e7d0", "#c8452f"]
  ];
  const shapes = {
    cake: (p) => `<rect width="400" height="300" fill="${p[0]}"/>
      <rect x="90" y="170" width="220" height="60" rx="6" fill="${p[2]}"/>
      <rect x="110" y="120" width="180" height="50" rx="6" fill="${p[1]}"/>
      <rect x="130" y="85" width="140" height="35" rx="6" fill="${p[3]}"/>
      <rect x="190" y="55" width="20" height="30" fill="${p[2]}"/><ellipse cx="200" cy="50" rx="8" ry="10" fill="${p[1]}"/>`,
    cupcake: (p) => `<rect width="400" height="300" fill="${p[0]}"/>
      <path d="M130 170 L270 170 L250 260 L150 260 Z" fill="${p[1]}"/>
      <ellipse cx="200" cy="150" rx="90" ry="45" fill="${p[2]}"/>
      <circle cx="170" cy="130" r="22" fill="${p[2]}"/><circle cx="230" cy="130" r="22" fill="${p[2]}"/>
      <circle cx="200" cy="115" r="26" fill="${p[3]}"/>`,
    whisk: (p) => `<rect width="400" height="300" fill="${p[0]}"/>
      <rect x="192" y="150" width="16" height="120" rx="6" fill="${p[2]}"/>
      <path d="M200 40 C150 60,150 170,200 170 C250 170,250 60,200 40 Z" fill="none" stroke="${p[2]}" stroke-width="10"/>
      <path d="M200 40 C170 80,170 140,200 170 C230 140,230 80,200 40 Z" fill="none" stroke="${p[1]}" stroke-width="8"/>`,
    cookies: (p) => {
      let s = `<rect width="400" height="300" fill="${p[0]}"/>`;
      for (let i = 0; i < 9; i++) {
        const x = 70 + (i % 3) * 110, y = 60 + Math.floor(i / 3) * 80;
        s += `<circle cx="${x}" cy="${y}" r="36" fill="${p[1]}"/><circle cx="${x - 8}" cy="${y - 6}" r="5" fill="${p[3]}"/><circle cx="${x + 10}" cy="${y + 8}" r="4" fill="${p[2]}"/>`;
      }
      return s;
    },
    pie: (p) => `<rect width="400" height="300" fill="${p[0]}"/>
      <circle cx="200" cy="150" r="100" fill="${p[1]}"/><circle cx="200" cy="150" r="82" fill="${p[2]}"/>

    macaron: (p) => {
      let s = `<rect width="400" height="300" fill="${p[0]}"/>`;
      for (let i = 0; i < 5; i++) {
        const x = 60 + i * 70, c = i % 2 ? p[1] : p[3];
        s += `<ellipse cx="${x}" cy="120" rx="30" ry="18" fill="${c}"/><rect x="${x - 30}" y="130" width="60" height="16" rx="8" fill="${p[2]}"/><ellipse cx="${x}" cy="152" rx="30" ry="18" fill="${c}"/>`;

    },
    bread: (p) => `<rect width="400" height="300" fill="${p[0]}"/>
      <ellipse cx="200" cy="160" rx="130" ry="80" fill="${p[1]}"/>
      <path d="M120 150 Q200 110 280 150" stroke="${p[2]}" stroke-width="10" fill="none"/>
      <path d="M140 180 Q200 150 260 180" stroke="${p[3]}" stroke-width="6" fill="none"/>`
  };
  const artNames = Object.keys(shapes);
  // Generated placeholder illustrations removed.
  const art = () => "";

  const recipeSets = [
    ["Sponge", "Cream 225g butter and 200g sugar until pale. Add eggs one at a time. Fold in 225g flour. Bake at 180C for 25 minutes.", "Cool fully before filling. Trim domes flat for even layers."],
    ["Shortcrust", "Rub 200g cold butter into 300g flour and a pinch of salt. Add 2 tbsp iced water until it holds together.", "Rest 30 minutes in the fridge. Blind bake with beans for 15 minutes."],
    ["Choux", "Boil 125ml water with 55g butter. Add 75g flour off the heat, then beat in 2 eggs one at a time.", "Pipe on a tray and bake at 200C until puffed. Do not open the oven early."],
    ["Meringue", "Whisk 4 egg whites with a pinch of cream of tartar. Add 115g sugar a spoon at a time until glossy.", "Dry in a 100C oven for 90 minutes. Do not rush the cooling."],
    ["Bread", "Mix 500g strong flour, 325ml warm water, 10g salt, and 7g yeast. Knead 10 minutes.", "First proof 1 hour. Shape, second proof 45 minutes, bake at 230C."],
    ["Custard", "Heat 500ml milk with a split vanilla pod. Whisk 4 yolks with 75g sugar and 25g cornflour.", "Pour the hot milk onto the yolks, return to the pan, and stir until thick."],
    ["Biscuits", "Cream 150g butter with 120g sugar. Add 1 egg and 280g flour and a pinch of salt.", "Chill the dough 20 minutes. Bake at 175C for 10 to 12 minutes."],
    ["Frosting", "Beat 200g softened butter with 400g icing sugar until smooth. Add 2 tbsp milk and vanilla.", "Crumb coat, chill 15 minutes, then finish. Warm the knife for smooth sides."]
  ];

  const timers = [
    ["Oven", "Preheat fan 170C. Check at 20 minutes. Rotate the tray halfway."],
    ["Proofing", "Dough doubles in size in a warm spot, usually 60 to 90 minutes."],
    ["Resting", "Let cakes cool 10 minutes in the tin, then turn out to a rack."],
    ["Chilling", "Dough and buttercream firm in the fridge in 20 to 30 minutes."]
  ];

  let count = 0;
  const positions = [];

  // x and y are the wanted offsetLeft/offsetTop; the value to put in style.left/top comes back (margins and any
  // rotation are accounted for).
  function keepOnScreen(el, x, y) {
    const par = el.offsetParent ? el.offsetParent.getBoundingClientRect() : { left: 0, top: 0 };
    const tb = document.querySelector(".taskbar");
    const floor = tb ? tb.getBoundingClientRect().top : window.innerHeight;
    const cs = getComputedStyle(el), r = el.getBoundingClientRect();
    const w = el.offsetWidth, h = el.offsetHeight;
    const ix = Math.max(0, (r.width - w) / 2), iy = Math.max(0, (r.height - h) / 2); // extra reach from rotation
    const vx = Math.min(Math.max(ix, window.innerWidth - w - ix), Math.max(ix, x + par.left));
    const vy = Math.min(Math.max(iy, floor - h - iy), Math.max(iy, y + par.top));
    return { x: vx - par.left - (parseFloat(cs.marginLeft) || 0), y: vy - par.top - (parseFloat(cs.marginTop) || 0) };

      const mcs = getComputedStyle(el);
      el.style.left = (x0 - (parseFloat(mcs.marginLeft) || 0)) + "px";
      el.style.top = (y0 - (parseFloat(mcs.marginTop) || 0)) + "px";
      el.style.right = "auto";
      el.style.bottom = "auto";
      el.style.transform = "none";
      const sx = e.clientX, sy = e.clientY;
      // The screen is a border: a window can be dragged anywhere inside it (above the taskbar) but never off it.
      const move = ev => {
        const p = keepOnScreen(el, x0 + ev.clientX - sx, y0 + ev.clientY - sy);
        el.style.left = p.x + "px";
        el.style.top = p.y + "px";
      };
      const up = () => {
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", up);
      };

      window.addEventListener("pointerup", up);
    });
